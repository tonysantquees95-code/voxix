name: App (interface, Windows e APK)

# Verifica a interface, gera o instalador do Windows (Tauri) e o APK do Android (Capacitor).
# Cada versão boa vira uma release "1.N" com VoxixSetup.exe e Voxix.apk (o Voxix e a Vênus usam essas releases para avisar de versão nova).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run test && npm run typecheck && npm run build
        working-directory: app
        env:
          VITE_BUILD: ${{ github.run_number }}

  windows:
    needs: verificar
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Instalar o Tauri e gerar os ícones
        run: |
          npm install -g @tauri-apps/cli@2
          cd desktop/src-tauri
          tauri icon ../app-icon.png
      - name: Gerar o instalador
        working-directory: desktop/src-tauri
        run: tauri build
        env:
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: voxix-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    needs: verificar
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Preparar o projeto Android
        working-directory: app
        run: |
          npm run build
          npx cap add android
          # a versão do app passa a ser a do build (1.<número>), para o Voxix comparar com a última publicada
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionName\|versionCode" android/app/build.gradle
          # ditado por voz do aparelho: microfone + visibilidade do serviço de reconhecimento de fala (Android 11+)
          sed -i "s#<application#<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <queries>\n        <intent>\n            <action android:name=\"android.speech.RecognitionService\" />\n        </intent>\n    </queries>\n    <application#" android/app/src/main/AndroidManifest.xml
          grep -c "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          # a tela fica entre as barras do Android (status e navegação), em qualquer configuração do aparelho
          cp native/MainActivity.java android/app/src/main/java/tech/vetorial/voxix/MainActivity.java
          npx capacitor-assets generate --android --iconBackgroundColor '#05070D' --iconBackgroundColorDark '#05070D' --splashBackgroundColor '#05070D' --splashBackgroundColorDark '#05070D'
          npx cap sync android
        env:
          VITE_BUILD: ${{ github.run_number }}
      - name: Compilar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # A chave de assinatura fica guardada (cifrada) no servidor da Vênus: cada versão instala por cima da anterior.
      - name: Assinar o APK
        run: bash .github/assinar-apk.sh app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: voxix-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publicar:
    needs: [windows, android]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voxix-windows
          path: pacote
      - uses: actions/download-artifact@v4
        with:
          name: voxix-android
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pacote/app-debug.apk pacote/Voxix.apk
          cp "$(ls pacote/*.exe | head -n 1)" pacote/VoxixSetup.exe
          gh release create "1.${{ github.run_number }}" pacote/Voxix.apk pacote/VoxixSetup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Voxix 1.${{ github.run_number }}" --notes "Voxix.apk (Android) e VoxixSetup.exe (Windows)."
